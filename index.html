<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#784527"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Pan y Bollería</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#30251d;background:#fffaf3}*{box-sizing:border-box}body{margin:0}header{background:#784527;color:white;padding:18px 16px}header h1{margin:0;font-size:23px}header small{opacity:.85}nav{display:flex;overflow:auto;background:#f3e5d5;position:sticky;top:0;z-index:2}nav button{flex:1;min-width:90px;border:0;background:transparent;padding:13px 8px;font-weight:700;color:#68442f}nav button.active{background:#fffaf3;border-bottom:3px solid #784527}main{max-width:850px;margin:auto;padding:16px 12px 80px}.card{background:#fff;border:1px solid #e8d8c7;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 5px #39220d0a}h2{margin:0 0 12px;font-size:21px}h3{margin:8px 0}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cdbbaa;border-radius:10px;font:inherit;background:white}button{font:inherit;cursor:pointer}.primary,.secondary,.danger{padding:11px 14px;border:0;border-radius:10px;margin:8px 6px 3px 0;font-weight:700}.primary{background:#784527;color:white}.secondary{background:#efe3d5;color:#55341f}.danger{background:#ffe3df;color:#9e2c22}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.stat{background:#f6ede3;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:#75675b;font-size:13px}.item{border-top:1px solid #eee0d2;padding:12px 0}.item:first-child{border-top:0}.right{float:right}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee0d2;text-align:left;padding:9px 4px}th{font-size:12px}.scroll{overflow:auto}table input{width:76px;padding:7px}.warn{color:#9a3d13;font-weight:700}.success{color:#236f43;font-weight:700}.hide{display:none}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}nav button{font-size:12px;min-width:75px}} 
textarea{width:100%;min-height:70px;padding:12px;border:1px solid #cdbbaa;border-radius:10px;font:inherit} .mini{font-size:12px}.pill{display:inline-block;background:#f3e5d5;border-radius:20px;padding:4px 9px;font-size:12px;margin:3px}.line{border:1px solid #eadbcd;border-radius:12px;padding:10px;margin:8px 0}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{font-size:13px}.numsmall{max-width:100px}.error{color:#9e2c22} .scroll table{min-width:550px} .sticky-note{background:#fff2cc;padding:12px;border-radius:12px}</style></head><body><header><h1>🥖 Pan y Bollería</h1><small>Taccuino e gestionale • dati salvati sul telefono</small></header><nav id="nav"></nav><main id="app"></main><script>

const KEY='panybolleria_v1';
const today=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
const money=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const num=n=>Math.max(0,Number(String(n??0).replace(',','.'))||0);
const qty=n=>Math.max(0,Math.floor(num(n)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};
if(!db||typeof db!=='object')db={};
db.products=Array.isArray(db.products)?db.products:[];
db.clients=Array.isArray(db.clients)?db.clients:[];
db.orders=Array.isArray(db.orders)?db.orders:[];
db.days=db.days&&typeof db.days==='object'?db.days:{};
// Keep the original localStorage key and original orders; migrate in memory without deleting history.
db.products.forEach(p=>{if(p.priceLocal==null)p.priceLocal=num(p.price);if(p.priceOutside==null)p.priceOutside=num(p.price);});
db.clients=db.clients.map(c=>typeof c==='string'?{id:id(),name:c,zone:'local',phone:'',address:'',notes:''}:{...c,id:c.id||id(),zone:c.zone==='outside'?'outside':'local'});
let tab='taccuino',date=today(),draft=[],editing=null,selectedClient='',clientEdit=null;
const prod=pid=>db.products.find(p=>p.id===pid);
const client=cid=>db.clients.find(c=>c.id===cid);
const day=()=>{let d=db.days[date]||(db.days[date]={});for(let k of ['extra','sold','soldLocal','soldOutside','ordered'])d[k] ||= {};d.expenses=num(d.expenses);return d};
const zoneName=z=>z==='outside'?'Fuori zona':'Dove vivi';
const salePrice=(p,z)=>num(z==='outside'?p?.priceOutside:p?.priceLocal);
const lines=o=>Array.isArray(o.items)?o.items:(o.product?[{product:o.product,qty:qty(o.qty),unitPrice:o.unitPrice??prod(o.product)?.price??0}]:[]);
const orders=()=>db.orders.filter(o=>o.date===date);
const orderedQty=pid=>orders().reduce((a,o)=>a+lines(o).filter(l=>l.product===pid).reduce((b,l)=>b+qty(l.qty),0),0);
const deliveredQty=pid=>orders().filter(o=>o.delivered).reduce((a,o)=>a+lines(o).filter(l=>l.product===pid).reduce((b,l)=>b+qty(l.qty),0),0);
const orderTotal=o=>lines(o).reduce((a,l)=>a+qty(l.qty)*num(l.unitPrice),0);
const orderName=o=>o.clientName||client(o.clientId)?.name||o.client||'Cliente';
const orderZone=o=>o.zone==='outside'?'outside':'local';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Salvataggio non riuscito: memoria del telefono piena? '+e.message);return}render()}
function changeTab(t){tab=t;render()}
function setDate(v){date=v||today();draft=[];editing=null;render()}
function setClient(v){selectedClient=v;draft=[];editing=null;render()}
function totals(){let d=day(),purchase=0,revenue=0,unsold=0,unsoldRetail=0,revLocal=0,revOutside=0;
 db.products.forEach(p=>{let q=orderedQty(p.id),x=qty(d.extra[p.id]),sl=qty(d.soldLocal[p.id]??d.sold[p.id]),so=qty(d.soldOutside[p.id]),del=deliveredQty(p.id);purchase+=(q+x)*num(p.cost);let remaining=Math.max(0,q-del+x-sl-so);unsold+=remaining*num(p.cost);unsoldRetail+=remaining*salePrice(p,'local');revLocal+=sl*salePrice(p,'local');revOutside+=so*salePrice(p,'outside')});
 orders().filter(o=>o.delivered).forEach(o=>{let r=orderTotal(o);if(orderZone(o)==='outside')revOutside+=r;else revLocal+=r});
 revenue=revLocal+revOutside;return{purchase,revenue,unsold,unsoldRetail,revLocal,revOutside,margin:revenue-purchase,net:revenue-purchase-num(d.expenses)}}
const field=(name,value='',type='text',extra='')=>`<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`;
function render(){
 document.getElementById('nav').innerHTML=[['taccuino','Taccuino'],['clienti','Clienti'],['panificio','Panificio'],['chiusura','Chiusura'],['prodotti','Prodotti'],['backup','Backup']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${n}</button>`).join('');
 let h=`<div class="card"><label>Giorno di consegna</label><input type="date" value="${date}" onchange="setDate(this.value)"></div>`;
 if(tab==='prodotti'){
 h+=`<div class="card"><h2>Catalogo prodotti</h2><form onsubmit="addProduct(event)"><label>Nome prodotto</label><input name="name" required placeholder="Es. Pan Italiano"><div class="grid"><div><label>Costo fornitore (€)</label>${field('cost','','number','step="0.01" min="0" required')}</div><div><label>Vendita dove vivi (€)</label>${field('local','','number','step="0.01" min="0" required')}</div><div><label>Vendita fuori zona (€)</label>${field('outside','','number','step="0.01" min="0" required')}</div></div><button class="primary">Aggiungi prodotto</button></form></div><div class="card"><h2>Listino a due zone</h2>${db.products.map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">Fornitore ${money(p.cost)} · Dove vivi ${money(p.priceLocal)} · Fuori zona ${money(p.priceOutside)}</div><button class="secondary" onclick="editProduct('${p.id}')">Modifica prezzi</button></div>`).join('')||'<p>Aggiungi il primo prodotto.</p>'}</div>`;
 }
 if(tab==='clienti'){
 let c=client(clientEdit);
 h+=`<div class="card"><h2>${c?'Modifica cliente':'Registra cliente'}</h2><form onsubmit="saveClient(event)"><label>Nome e cognome</label>${field('name',c?.name||'','text','required')}<label>Telefono</label>${field('phone',c?.phone||'','tel')}<label>Indirizzo di consegna</label>${field('address',c?.address||'')}<label>Zona di vendita</label><select name="zone"><option value="local" ${c?.zone!=='outside'?'selected':''}>Dove vivi</option><option value="outside" ${c?.zone==='outside'?'selected':''}>Fuori zona</option></select><label>Note</label><textarea name="notes">${esc(c?.notes||'')}</textarea><button class="primary">${c?'Salva modifiche':'Salva cliente'}</button>${c?'<button type="button" class="secondary" onclick="clientEdit=null;render()">Annulla</button>':''}</form></div>`;
 h+=`<div class="card"><h2>Rubrica (${db.clients.length})</h2>${db.clients.map(c=>{let os=db.orders.filter(o=>o.clientId===c.id||(!o.clientId&&o.client===c.name));return `<div class="item"><b>${esc(c.name)}</b> <span class="pill">${zoneName(c.zone)}</span><div class="muted">${esc(c.phone||'')} ${esc(c.address||'')} ${c.notes?' · '+esc(c.notes):''}</div><div class="muted">Ordini registrati: ${os.length}</div><div class="actions"><button class="secondary" onclick="clientEdit='${c.id}';render()">Modifica</button><button class="secondary" onclick="newForClient('${c.id}')">Nuovo ordine</button><button class="secondary" onclick="repeatLast('${c.id}')">Ripeti ultimo ordine</button></div></div>`}).join('')||'<p>Nessun cliente registrato.</p>'}</div>`;
 }
 if(tab==='taccuino'){
 let c=client(selectedClient),z=c?.zone||'local';
 h+=`<div class="card"><h2>${editing?'Modifica ordine':'Nuovo ordine cliente'}</h2><label>Cliente registrato</label><select onchange="setClient(this.value)"><option value="">Seleziona cliente</option>${db.clients.map(c=>`<option value="${c.id}" ${selectedClient===c.id?'selected':''}>${esc(c.name)} — ${zoneName(c.zone)}</option>`).join('')}</select><div class="actions"><button class="secondary" onclick="changeTab('clienti')">+ Registra cliente</button>${c?`<button class="secondary" onclick="repeatLast('${c.id}')">Ripeti ultimo ordine</button>`:''}</div>${c?`<p class="muted">Listino: <b>${zoneName(z)}</b> · ${esc(c.address||'Nessun indirizzo')}</p>`:'<p class="warn">Prima seleziona un cliente dalla rubrica.</p>'}
 <div class="line"><label>Prodotto da aggiungere</label><select id="pickProduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(salePrice(p,z))}</option>`).join('')}</select><label>Quantità</label><input id="pickQty" type="number" min="1" step="1" value="1"><button class="secondary" onclick="addDraftLine()" ${!c||!db.products.length?'disabled':''}>+ Aggiungi articolo</button></div>
 <h3>Articoli dell'ordine</h3>${draft.map((l,i)=>`<div class="item"><b>${esc(prod(l.product)?.name||'Prodotto')}</b> × ${l.qty} <span class="right">${money(l.qty*l.unitPrice)}</span><div class="muted">${money(l.unitPrice)} al pezzo</div><button class="danger" onclick="removeDraftLine(${i})">Rimuovi</button></div>`).join('')||'<p class="muted">Aggiungi uno o più articoli.</p>'}<h3>Totale: ${money(draft.reduce((a,l)=>a+l.qty*l.unitPrice,0))}</h3><button class="primary" onclick="saveOrder()" ${!c||!draft.length?'disabled':''}>${editing?'Salva modifiche ordine':'Salva prenotazione'}</button>${editing?'<button class="secondary" onclick="cancelDraft()">Annulla modifica</button>':''}</div>`;
 h+=`<div class="card"><h2>Prenotazioni del giorno (${orders().length})</h2>${orders().map(o=>`<div class="item"><b>${esc(orderName(o))}</b> <span class="pill">${zoneName(orderZone(o))}</span>${lines(o).map(l=>`<div class="muted">${esc(prod(l.product)?.name||'Prodotto non presente')} × ${qty(l.qty)} · ${money(qty(l.qty)*num(l.unitPrice))}</div>`).join('')}<b>Totale ${money(orderTotal(o))}</b><label><input style="width:auto" type="checkbox" ${o.delivered?'checked':''} onchange="toggleOrder('${o.id}','delivered',this.checked)"> Consegnato</label><label><input style="width:auto" type="checkbox" ${o.paid?'checked':''} onchange="toggleOrder('${o.id}','paid',this.checked)"> Pagato</label><div class="actions"><button class="secondary" onclick="editOrder('${o.id}')">Modifica</button><button class="danger" onclick="removeOrder('${o.id}')">Elimina</button></div></div>`).join('')||'<p>Nessuna prenotazione per questa data.</p>'}</div>`;
 }
 if(tab==='panificio'){
 let d=day();h+=`<div class="card"><h2>Lista per il panificio</h2><p class="muted">Tutti gli articoli degli ordini del giorno si sommano automaticamente, anche se appartengono a clienti di zone diverse. Gli extra si aggiungono separatamente.</p><div class="scroll"><table><thead><tr><th>Prodotto</th><th>Prenotato</th><th>Extra</th><th>Da acquistare</th><th>Già ordinato</th><th>Differenza</th></tr></thead><tbody>${db.products.map(p=>{let q=orderedQty(p.id),x=qty(d.extra[p.id]),sent=qty(d.ordered[p.id]),diff=q+x-sent;return `<tr><td>${esc(p.name)}</td><td>${q}</td><td><input type="number" min="0" step="1" value="${x}" onchange="setDay('extra','${p.id}',this.value)"></td><td><b>${q+x}</b></td><td><input type="number" min="0" step="1" value="${sent}" onchange="setDay('ordered','${p.id}',this.value)"></td><td class="${diff>0?'warn':''}">${diff>0?'+':''}${diff}</td></tr>`}).join('')}</tbody></table></div><p class="muted">Differenza positiva = pezzi ancora da richiedere. Differenza negativa = pezzi già ordinati in eccesso.</p><button class="primary" onclick="copyList()">Copia lista panificio</button></div>`;
 }
 if(tab==='chiusura'){
 let d=day(),t=totals();h+=`<div class="card"><h2>Chiusura turno</h2><p class="muted">Segna le consegne nel Taccuino. Qui registra gli extra venduti nelle due zone.</p><div class="scroll"><table><thead><tr><th>Prodotto</th><th>Prenotato</th><th>Consegnato</th><th>Extra comprato</th><th>Venduto dove vivi</th><th>Venduto fuori zona</th><th>Rimasto</th></tr></thead><tbody>${db.products.map(p=>{let q=orderedQty(p.id),del=deliveredQty(p.id),x=qty(d.extra[p.id]),sl=qty(d.soldLocal[p.id]??d.sold[p.id]),so=qty(d.soldOutside[p.id]);return `<tr><td>${esc(p.name)}</td><td>${q}</td><td>${del}</td><td>${x}</td><td><input type="number" min="0" step="1" value="${sl}" onchange="setSold('${p.id}','local',this.value)"></td><td><input type="number" min="0" step="1" value="${so}" onchange="setSold('${p.id}','outside',this.value)"></td><td>${Math.max(0,q-del+x-sl-so)}</td></tr>`}).join('')}</tbody></table></div><label>Altre spese del turno (€), es. carburante</label><input type="number" min="0" step="0.01" value="${num(d.expenses)}" onchange="setExpense(this.value)"></div><div class="card"><h2>Riepilogo economico</h2><div class="grid"><div class="stat">Acquisti<b>${money(t.purchase)}</b></div><div class="stat">Incassi dove vivi<b>${money(t.revLocal)}</b></div><div class="stat">Incassi fuori zona<b>${money(t.revOutside)}</b></div><div class="stat">Vendite registrate<b>${money(t.revenue)}</b></div><div class="stat">Margine lordo<b>${money(t.margin)}</b></div><div class="stat">Netto gestionale stimato<b>${money(t.net)}</b></div><div class="stat">Invenduto al costo<b>${money(t.unsold)}</b></div><div class="stat">Invenduto al prezzo locale<b>${money(t.unsoldRetail)}</b></div></div><p class="muted">Il costo degli invenduti è già incluso negli acquisti. Incassi = consegne segnate + vendite extra; il segno “Pagato” resta un controllo separato. Il netto stimato non comprende imposte o spese non inserite.</p></div>`;
 }
 if(tab==='backup')h+=`<div class="card"><h2>Backup dei dati</h2><p class="sticky-note"><b>Prima di aggiornare l'app:</b> premi «Scarica backup JSON» e conserva il file sul telefono o in un luogo sicuro.</p><button class="primary" onclick="exportData()">Scarica backup JSON</button><label>Ripristina da un backup</label><input type="file" accept=".json,application/json" onchange="importData(this)"><p class="warn">Il ripristino sostituisce tutti i dati attuali.</p></div><div class="card"><h2>Informazioni</h2><p>Funziona offline dopo il primo caricamento completo. I dati restano su questo dispositivo/browser e non si sincronizzano con altri telefoni. I vecchi ordini e prezzi restano conservati.</p></div>`;
 document.getElementById('app').innerHTML=h;
}
function addProduct(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let cost=num(f.get('cost')),priceLocal=num(f.get('local')),priceOutside=num(f.get('outside'));db.products.push({id:id(),name,cost,price:priceLocal,priceLocal,priceOutside});save()}
function editProduct(pid){let p=prod(pid);if(!p)return;let c=prompt('Costo fornitore (€)',p.cost);if(c===null)return;let l=prompt('Prezzo dove vivi (€)',p.priceLocal);if(l===null)return;let o=prompt('Prezzo fuori zona (€)',p.priceOutside);if(o===null)return;p.cost=num(c);p.priceLocal=num(l);p.priceOutside=num(o);p.price=p.priceLocal;save()}
function saveClient(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;let c=client(clientEdit);let values={name,phone:String(f.get('phone')||''),address:String(f.get('address')||''),notes:String(f.get('notes')||''),zone:f.get('zone')==='outside'?'outside':'local'};if(c)Object.assign(c,values);else db.clients.push({id:id(),...values});clientEdit=null;save()}
function newForClient(cid){selectedClient=cid;draft=[];editing=null;tab='taccuino';render()}
function repeatLast(cid){let c=client(cid);if(!c)return;let o=db.orders.filter(o=>o.clientId===cid||(!o.clientId&&o.client===c.name)).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];if(!o){alert('Questo cliente non ha ancora ordini da ripetere.');return}selectedClient=cid;editing=null;draft=lines(o).filter(l=>prod(l.product)).map(l=>({product:l.product,qty:qty(l.qty),unitPrice:salePrice(prod(l.product),c.zone)}));tab='taccuino';render()}
function addDraftLine(){let c=client(selectedClient),p=prod(document.getElementById('pickProduct')?.value),n=qty(document.getElementById('pickQty')?.value);if(!c||!p||!n){alert('Seleziona un cliente, un prodotto e una quantità valida.');return}draft.push({product:p.id,qty:n,unitPrice:salePrice(p,c.zone)});render()}
function removeDraftLine(i){draft.splice(i,1);render()}
function cancelDraft(){draft=[];editing=null;render()}
function saveOrder(){let c=client(selectedClient);if(!c||!draft.length)return;let items=draft.map(l=>({...l}));let o=editing&&db.orders.find(o=>o.id===editing);if(o)Object.assign(o,{clientId:c.id,clientName:c.name,client:c.name,zone:c.zone,items,product:undefined,qty:undefined});else db.orders.push({id:id(),date,clientId:c.id,clientName:c.name,client:c.name,zone:c.zone,items,delivered:false,paid:false});draft=[];editing=null;save()}
function editOrder(oid){let o=db.orders.find(o=>o.id===oid);if(!o)return;let c=client(o.clientId)||db.clients.find(c=>c.name===o.client);if(!c){c={id:id(),name:orderName(o),zone:orderZone(o),phone:'',address:'',notes:''};db.clients.push(c)}selectedClient=c.id;editing=o.id;draft=lines(o).map(l=>({...l,qty:qty(l.qty),unitPrice:num(l.unitPrice)}));render();window.scrollTo(0,0)}
function toggleOrder(oid,key,val){let o=db.orders.find(o=>o.id===oid);if(o){o[key]=val;save()}}
function removeOrder(oid){if(confirm('Eliminare questa prenotazione?')){db.orders=db.orders.filter(o=>o.id!==oid);if(editing===oid)cancelDraft();save()}}
function setDay(key,pid,val){day()[key][pid]=qty(val);save()}
function setSold(pid,z,val){let d=day(),x=qty(d.extra[pid]),other=qty(z==='local'?d.soldOutside[pid]:(d.soldLocal[pid]??d.sold[pid])),v=qty(val);if(v+other>x){alert('Le vendite extra delle due zone non possono superare gli extra acquistati.');v=Math.max(0,x-other)}d[z==='local'?'soldLocal':'soldOutside'][pid]=v;save()}
function setExpense(v){day().expenses=num(v);save()}
async function copyList(){let d=day(),txt=`PANIFICIO - ${date}\n`+db.products.map(p=>`${p.name}: ${orderedQty(p.id)+qty(d.extra[p.id])} (prenotati ${orderedQty(p.id)}, extra ${qty(d.extra[p.id])}, già ordinati ${qty(d.ordered[p.id])}, differenza ${orderedQty(p.id)+qty(d.extra[p.id])-qty(d.ordered[p.id])})`).join('\n');try{await navigator.clipboard.writeText(txt);alert('Lista copiata')}catch{prompt('Copia la lista:',txt)}}
function exportData(){let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pan-y-bolleria-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(input){let file=input.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text()),d=parsed.data;if(!d||!Array.isArray(d.products)||!Array.isArray(d.orders)||!d.days||typeof d.days!=='object')throw Error('Formato non valido');if(!confirm('Sostituire tutti i dati attuali con quelli del backup?'))return;db=d;db.clients=Array.isArray(db.clients)?db.clients:[];db.clients=db.clients.map(c=>typeof c==='string'?{id:id(),name:c,zone:'local'}:c);db.products.forEach(p=>{p.priceLocal??=num(p.price);p.priceOutside??=num(p.price)});draft=[];editing=null;selectedClient='';save();alert('Backup ripristinato')}catch(e){alert('Impossibile importare: '+e.message)}}
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script></body></html>
