<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#784527"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Pan y Bollería</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#30251d;background:#fffaf3}*{box-sizing:border-box}body{margin:0}header{background:#784527;color:white;padding:18px 16px}header h1{margin:0;font-size:23px}header small{opacity:.85}nav{display:flex;overflow:auto;background:#f3e5d5;position:sticky;top:0;z-index:2}nav button{flex:1;min-width:90px;border:0;background:transparent;padding:13px 8px;font-weight:700;color:#68442f}nav button.active{background:#fffaf3;border-bottom:3px solid #784527}main{max-width:850px;margin:auto;padding:16px 12px 80px}.card{background:#fff;border:1px solid #e8d8c7;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 5px #39220d0a}h2{margin:0 0 12px;font-size:21px}h3{margin:8px 0}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cdbbaa;border-radius:10px;font:inherit;background:white}button{font:inherit;cursor:pointer}.primary,.secondary,.danger{padding:11px 14px;border:0;border-radius:10px;margin:8px 6px 3px 0;font-weight:700}.primary{background:#784527;color:white}.secondary{background:#efe3d5;color:#55341f}.danger{background:#ffe3df;color:#9e2c22}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.stat{background:#f6ede3;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:#75675b;font-size:13px}.item{border-top:1px solid #eee0d2;padding:12px 0}.item:first-child{border-top:0}.right{float:right}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #eee0d2;text-align:left;padding:9px 4px}th{font-size:12px}.scroll{overflow:auto}table input{width:76px;padding:7px}.warn{color:#9a3d13;font-weight:700}.success{color:#236f43;font-weight:700}.hide{display:none}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}nav button{font-size:12px;min-width:75px}} </style></head><body><header><h1>🥖 Pan y Bollería</h1><small>Taccuino e gestionale • dati salvati sul telefono</small></header><nav id="nav"></nav><main id="app"></main><script>
const KEY='panybolleria_v1';const today=()=>new Date().toLocaleDateString('en-CA');let db;try{db=JSON.parse(localStorage.getItem(KEY))||{products:[],clients:[],orders:[],days:{}}}catch{db={products:[],clients:[],orders:[],days:{}}}db.products||=[];db.clients||=[];db.orders||=[];db.days||={};let tab='taccuino',date=today();const money=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}),num=n=>Math.max(0,Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},day=()=>db.days[date]||(db.days[date]={extra:{},sold:{},delivered:{},ordered:{},expenses:0}),prod=id=>db.products.find(p=>p.id===id),orders=()=>db.orders.filter(o=>o.date===date),orderedQty=pid=>orders().filter(o=>o.product===pid).reduce((a,o)=>a+num(o.qty),0),deliveredQty=pid=>orders().filter(o=>o.product===pid&&o.delivered).reduce((a,o)=>a+num(o.qty),0),cost=p=>num(p.cost),price=p=>num(p.price);function changeTab(t){tab=t;render()}function setDate(v){date=v||today();render()}function totals(){let d=day(),purchase=0,revenue=0,unsold=0,unsoldRetail=0,booked=0,extraSold=0;db.products.forEach(p=>{let q=orderedQty(p.id),x=num(d.extra[p.id]),s=Math.min(x,num(d.sold[p.id])),del=deliveredQty(p.id);purchase+=(q+x)*cost(p);revenue+=(del+s)*price(p);unsold+=(q-del+x-s)*cost(p);unsoldRetail+=(q-del+x-s)*price(p);booked+=del;extraSold+=s});return{purchase,revenue,unsold,unsoldRetail,booked,extraSold,margin:revenue-purchase,net:revenue-purchase-num(d.expenses)}}function render(){document.getElementById('nav').innerHTML=[['taccuino','Taccuino'],['panificio','Panificio'],['chiusura','Chiusura'],['prodotti','Prodotti'],['backup','Backup']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${n}</button>`).join('');let h=`<div class="card"><label>Giorno di consegna</label><input type="date" value="${date}" onchange="setDate(this.value)"></div>`;if(tab==='prodotti'){h+=`<div class="card"><h2>Catalogo prodotti</h2><form onsubmit="addProduct(event)"><label>Nome prodotto</label><input name="name" required placeholder="Es. Pan italiano"><div class="grid"><div><label>Prezzo fornitore (€)</label><input name="cost" type="number" step="0.01" min="0" required></div><div><label>Prezzo vendita (€)</label><input name="price" type="number" step="0.01" min="0" required></div></div><button class="primary">Aggiungi prodotto</button></form></div><div class="card"><h2>Listino</h2>${db.products.map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">Costo ${money(p.cost)} • Vendita ${money(p.price)}</div><button class="secondary" onclick="editProduct('${p.id}')">Modifica prezzi</button></div>`).join('')||'<p>Aggiungi il primo prodotto.</p>'}</div>`}
if(tab==='taccuino'){h+=`<div class="card"><h2>Nuovo ordine cliente</h2><form onsubmit="addOrder(event)"><label>Nome cliente</label><input name="client" required list="clients" placeholder="Nome cliente"><datalist id="clients">${db.clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>Prodotto</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select><label>Quantità</label><input type="number" name="qty" min="1" step="1" value="1" required><button class="primary" ${!db.products.length?'disabled':''}>Salva prenotazione</button></form>${!db.products.length?'<p class="warn">Prima aggiungi i prodotti nella sezione Prodotti.</p>':''}</div><div class="card"><h2>Prenotazioni del giorno (${orders().length})</h2>${orders().map(o=>`<div class="item"><b>${esc(o.client)}</b> • ${esc(prod(o.product)?.name||'Prodotto eliminato')} × ${o.qty}<div class="muted">Totale indicativo: ${money(num(o.qty)*num(o.unitPrice??prod(o.product)?.price))}</div><label><input style="width:auto" type="checkbox" ${o.delivered?'checked':''} onchange="toggleOrder('${o.id}','delivered',this.checked)"> Consegnato</label><label><input style="width:auto" type="checkbox" ${o.paid?'checked':''} onchange="toggleOrder('${o.id}','paid',this.checked)"> Pagato</label><button class="danger" onclick="removeOrder('${o.id}')">Elimina ordine</button></div>`).join('')||'<p>Nessuna prenotazione per questa data.</p>'}</div>`}
if(tab==='panificio'){let d=day();h+=`<div class="card"><h2>Lista per il panificio</h2><p class="muted">Le prenotazioni si sommano automaticamente. Inserisci gli extra acquistati e quanto hai già comunicato al panificio.</p><div class="scroll"><table><thead><tr><th>Prodotto</th><th>Prenotato</th><th>Extra</th><th>Da acquistare</th><th>Già ordinato</th><th>Differenza</th></tr></thead><tbody>${db.products.map(p=>{let q=orderedQty(p.id),x=num(d.extra[p.id]),sent=num(d.ordered[p.id]),diff=q+x-sent;return `<tr><td>${esc(p.name)}</td><td>${q}</td><td><input type="number" min="0" value="${x}" onchange="setDay('extra','${p.id}',this.value)"></td><td><b>${q+x}</b></td><td><input type="number" min="0" value="${sent}" onchange="setDay('ordered','${p.id}',this.value)"></td><td class="${diff?'warn':''}">${diff>0?'+':''}${diff}</td></tr>`}).join('')}</tbody></table></div><button class="primary" onclick="copyList()">Copia lista panificio</button></div>`}
if(tab==='chiusura'){let d=day(),t=totals();h+=`<div class="card"><h2>Chiusura turno</h2><p class="muted">Segna le prenotazioni consegnate nel Taccuino. Qui registra gli extra venduti. Il pane non venduto resta un costo.</p><div class="scroll"><table><thead><tr><th>Prodotto</th><th>Prenotato</th><th>Consegnato</th><th>Extra comprato</th><th>Extra venduto</th><th>Rimasto</th></tr></thead><tbody>${db.products.map(p=>{let q=orderedQty(p.id),del=deliveredQty(p.id),x=num(d.extra[p.id]),s=Math.min(x,num(d.sold[p.id]));return `<tr><td>${esc(p.name)}</td><td>${q}</td><td>${del}</td><td>${x}</td><td><input type="number" min="0" max="${x}" value="${s}" onchange="setSold('${p.id}',this.value)"></td><td>${q-del+x-s}</td></tr>`}).join('')}</tbody></table></div><label>Altre spese del turno (€), es. carburante</label><input type="number" min="0" step="0.01" value="${num(d.expenses)}" onchange="setExpense(this.value)"></div><div class="card"><h2>Riepilogo economico</h2><div class="grid"><div class="stat">Acquisti<b>${money(t.purchase)}</b></div><div class="stat">Vendite registrate<b>${money(t.revenue)}</b></div><div class="stat">Margine lordo<b>${money(t.margin)}</b></div><div class="stat">Netto gestionale stimato<b>${money(t.net)}</b></div><div class="stat">Invenduto al costo<b>${money(t.unsold)}</b></div><div class="stat">Invenduto al prezzo vendita<b>${money(t.unsoldRetail)}</b></div></div><p class="muted">Margine lordo = vendite meno costo di tutti gli acquisti. Netto stimato = margine lordo meno altre spese. Imposte e costi non inseriti esclusi. Il costo dell'invenduto è già incluso negli acquisti.</p></div>`}
if(tab==='backup'){h+=`<div class="card"><h2>Backup dei dati</h2><p>Esporta regolarmente un backup JSON e conservalo fuori dal telefono. Se cancelli i dati del browser, potresti perdere gli ordini.</p><button class="primary" onclick="exportData()">Scarica backup JSON</button><label>Ripristina da un backup</label><input type="file" accept=".json,application/json" onchange="importData(this)"><p class="warn">Il ripristino sostituisce tutti i dati attuali.</p></div><div class="card"><h2>Informazioni</h2><p>Questa versione funziona offline dopo il primo caricamento completo da GitHub Pages. I dati sono salvati soltanto su questo dispositivo/browser, non sincronizzati online.</p></div>`}document.getElementById('app').innerHTML=h}
function addProduct(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;db.products.push({id:id(),name,cost:num(f.get('cost')),price:num(f.get('price'))});save()}function editProduct(pid){let p=prod(pid);if(!p)return;let c=prompt('Prezzo fornitore (€)',p.cost);if(c===null)return;let v=prompt('Prezzo vendita (€)',p.price);if(v===null)return;p.cost=num(c.replace(',','.'));p.price=num(v.replace(',','.'));save()}function addOrder(e){e.preventDefault();let f=new FormData(e.target),client=String(f.get('client')).trim(),pid=String(f.get('product')),p=prod(pid);if(!client||!p)return;db.orders.push({id:id(),date,client,product:pid,qty:Math.max(1,Math.floor(num(f.get('qty')))),unitPrice:p.price,delivered:false,paid:false});if(!db.clients.includes(client))db.clients.push(client);save()}function toggleOrder(oid,key,val){let o=db.orders.find(o=>o.id===oid);if(o){o[key]=val;save()}}function removeOrder(oid){if(confirm('Eliminare questa prenotazione?')){db.orders=db.orders.filter(o=>o.id!==oid);save()}}function setDay(key,pid,val){day()[key][pid]=num(val);save()}function setSold(pid,val){let x=num(day().extra[pid]),v=num(val);if(v>x)alert('Non puoi vendere più extra di quanti ne hai acquistati.');day().sold[pid]=Math.min(x,v);save()}function setExpense(v){day().expenses=num(v);save()}async function copyList(){let d=day(),txt=`PANIFICIO - ${date}\n`+db.products.map(p=>`${p.name}: ${orderedQty(p.id)+num(d.extra[p.id])} (prenotati ${orderedQty(p.id)}, extra ${num(d.extra[p.id])})`).join('\n');try{await navigator.clipboard.writeText(txt);alert('Lista copiata')}catch{prompt('Copia la lista:',txt)}}function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pan-y-bolleria-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(input){let file=input.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text()),d=parsed.data;if(!d||!Array.isArray(d.products)||!Array.isArray(d.orders)||typeof d.days!=='object')throw Error('Formato non valido');if(!confirm('Sostituire tutti i dati attuali con quelli del backup?'))return;db=d;db.clients||=[];save();alert('Backup ripristinato')}catch(e){alert('Impossibile importare: '+e.message)}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
